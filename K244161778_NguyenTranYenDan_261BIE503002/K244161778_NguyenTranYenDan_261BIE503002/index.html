<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trang chủ bán hàng - BW08</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Header Semantic -->
  <header>
    <h2>NTYD Shop</h2>
    <nav>
      <a href="index.html">Trang chủ</a>
      <a href="admin.html">Dashboard Admin</a>
      <a href="javascript:void(0)" onclick="CartManager.toggleMiniCart()">🛒 Giỏ hàng (<span id="cartCount">0</span>)</a>
    </nav>
  </header>

  <!-- Mini Cart Popup (Câu 6: position: absolute, z-index) -->
  <div id="miniCart">
    <h4>Giỏ Hàng Của Bạn</h4>
    <ul id="cartItemsList"></ul>
    <p><strong>Tổng cộng: $<span id="cartTotal">0.00</span></strong></p>
    <button class="btn-checkout" style="margin-top: 10px;" onclick="openCheckoutModal()">Thanh toán ngay</button>
  </div>

  <!-- Layout chính Semantic: aside và section -->
  <main class="main-layout">
    <!-- Aside: Form Tìm kiếm Nâng cao (Câu 2) -->
    <aside class="sidebar">
      <h3>Tìm Kiếm Nâng Cao</h3>
      <form id="filterForm">
        <div class="filter-group">
          <label for="filterPrice">Giá tối đa ($):</label>
          <input type="number" id="filterPrice" min="0" max="2000" placeholder="VD: 200">
        </div>
        <div class="filter-group">
          <label for="filterColor">Màu sắc:</label>
          <select id="filterColor">
            <option value="">-- Tất cả màu --</option>
            <option value="Black">Black</option>
            <option value="Blue">Blue</option>
            <option value="Red">Red</option>
            <option value="Gold">Gold</option>
            <option value="Silver">Silver</option>
            <option value="Brown">Brown</option>
            <option value="White">White</option>
            <option value="Grey">Grey</option>
            <option value="Rose Gold">Rose Gold</option>
            <option value="Purple">Purple</option>
            <option value="Pink">Pink</option>
            <option value="Yellow">Yellow</option>
          </select>
        </div>
        <div class="filter-group">
          <label for="filterRating">Đánh giá tối thiểu:</label>
          <input type="number" id="filterRating" min="1" max="5" step="0.5" placeholder="Từ 1 đến 5 sao">
        </div>
        <div class="filter-group">
          <label for="filterCategory">Danh mục:</label>
          <select id="filterCategory">
            <option value="">-- Tất cả danh mục --</option>
            <option value="men's clothing">Men's clothing</option>
            <option value="women's clothing">Women's clothing</option>
            <option value="jewelery">Jewelery</option>
            <option value="electronics">Electronics</option>
          </select>
        </div>

        <!-- Nút Tìm kiếm và Đặt lại -->
        <div style="display: flex; gap: 8px; margin-top: 10px;">
          <button type="submit" style="flex: 1; background: #2980b9; color: white;">Tìm Kiếm</button>
          <button type="button" id="btnResetFilter" style="background: #95a5a6; color: white;">Đặt lại</button>
        </div>
      </form>
    </aside>

    <!-- Section chứa danh sách sản phẩm Grid & Responsive (Câu 3, Câu 4) -->
    <section class="products-section">
      <div id="productList" class="product-grid">
        <!-- Skeleton Loading lúc ban đầu -->
        <div class="skeleton-card"></div>
        <div class="skeleton-card"></div>
        <div class="skeleton-card"></div>
        <div class="skeleton-card"></div>
      </div>
    </section>
  </main>

  <!-- Modal Checkout (Câu 7) -->
  <div id="checkoutModal" class="modal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeModal('checkoutModal')">&times;</span>
      <h3>Thông Tin Thanh Toán</h3>
      <form id="checkoutForm" onsubmit="event.preventDefault(); submitCheckout();" style="margin-top: 1rem;">
        <div class="filter-group">
          <label>Họ và tên khách hàng:</label>
          <input type="text" id="custName" required placeholder="VD: Nguyễn Văn A">
        </div>
        <div class="filter-group">
          <label>Số điện thoại (Việt Nam):</label>
          <input type="text" id="custPhone" placeholder="VD: 0912345678 hoặc +84912345678">
          <span id="phoneError" class="error-text"></span>
        </div>
        <div class="filter-group">
          <label>Email:</label>
          <input type="text" id="custEmail" placeholder="VD: example@email.com">
          <span id="emailError" class="error-text"></span>
        </div>
        <button type="submit" class="btn-checkout" style="padding: 0.7rem;">Xác Nhận Đặt Hàng</button>
      </form>
    </div>
  </div>

  <!-- Modal Chi tiết đánh giá Rating Detail (Câu 5) -->
  <div id="ratingModal" class="modal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeModal('ratingModal')">&times;</span>
      <h3>Chi Tiết Đánh Giá Sản Phẩm</h3>
      <div id="ratingDetailContent" style="margin-top: 1rem; max-height: 250px; overflow-y: auto;"></div>
    </div>
  </div>

  <!-- Modal Xem Nhanh Sản Phẩm (Câu 4) -->
  <div id="quickViewModal" class="modal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeModal('quickViewModal')">&times;</span>
      <div id="quickViewContent"></div>
    </div>
  </div>

  <!-- Footer bắt buộc theo yêu cầu đề bài -->
  <footer>
    <p>Họ và Tên Sinh Viên: Nguyễn Trần Yên Đan - Mã Sinh Viên: K244161778</p>
  </footer>

  <!-- Nhúng các file script JS -->
  <script src="js/cart.js"></script>
  <script src="js/reviews.js"></script>
  <script src="js/checkout.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
